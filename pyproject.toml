[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-distill-watermark"
version = "0.1.0"
description = "Payload-carrying LLM ownership watermark via LoRA-injected fictitious knowledge (codebook + Reed-Solomon, black-box verifiable, recipient-traceable)."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "Rick" }]
keywords = ["llm", "watermark", "fingerprint", "lora", "model-ownership", "backdoor-fingerprint"]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "torch>=2.3",
  "transformers>=4.45",
  "peft>=0.13",
  "accelerate>=0.34",
  "datasets>=2.20",
  "reedsolo>=1.7",
  "pyyaml>=6.0",
  "typer>=0.12",
  "numpy>=1.26",
  "scipy>=1.11",
  "rapidfuzz>=3.9",
  "rich>=13.7",
]

[project.optional-dependencies]
openai = ["openai>=1.40"]
eval = ["lm-eval>=0.4.4"]
cuda = ["bitsandbytes>=0.43"]
wandb = ["wandb>=0.17"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]

[project.scripts]
llm-distill-watermark = "llm_distill_watermark.cli:app"
ldw = "llm_distill_watermark.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["llm_distill_watermark"]

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["runs", "data", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "PIE", "PT", "RUF"]
ignore = [
  "E501",   # line length is handled by the formatter; long template strings are fine
  "RUF001", # ambiguous unicode (full-width Chinese punctuation is intentional)
  "RUF002",
  "RUF003",
  "RUF012", # mutable class attributes (template lists in domain classes)
  "B008",   # typer.Option(...) in argument defaults is the Typer idiom
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PT011", "SIM117", "B011"]

[tool.ruff.lint.isort]
known-first-party = ["llm_distill_watermark"]

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "slow: needs a real model / minutes of compute (run with --run-slow or LDW_RUN_SLOW=1)",
  "network: needs internet access (HF hub downloads)",
  "lm_eval: needs the optional lm-eval extra",
]

[tool.coverage.run]
source = ["llm_distill_watermark"]
branch = true

[tool.coverage.report]
skip_covered = false
show_missing = true
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:", "raise NotImplementedError", "\\.\\.\\."]
